# Verified source constants. Values change only with a measurement behind them.
bmkg:
  url: https://api.bmkg.go.id/publik/prakiraan-cuaca
  max_rpm: 55                  # BMKG limit is 60 per minute per IP
  tick_minutes: 15
  retry_missing_hours: 6
  sentinels: ["35.73", "73.71", "91.71"]
  rain_codes_min: 60           # codes 60-99 count as rain for the baseline

imerg:
  collection: C2723758340-GES_DISC        # GPM_3IMERGHHE v07
  opendap: https://opendap.earthdata.nasa.gov/collections/C2723758340-GES_DISC/granules/
  variable: /Grid/precipitation           # [time][lon][lat], lat ascending, mm/hr, fill -9999.9
  lon_index: [2740, 3219]                 # 94.05E .. 141.95E (cell centres, 0.1 deg)
  lat_index: [785, 964]                   # 11.45S .. 6.45N
  wet_mm_h: 0.1
  lag_minutes: 300                        # replace with measured p90 live latency

mergir:
  collection: C1432254058-GES_DISC        # GPM_MERGIR v1
  opendap: https://opendap.earthdata.nasa.gov/collections/C1432254058-GES_DISC/granules/
  variable: /Tb                           # [time 2][lat][lon], int16 K, fill -9999
  lat_index: [1333, 1827]                 # -11.4797 .. 6.4948
  lon_index: [7532, 8850]                 # 94.0198 .. 141.9665
  cold_k: 233
  flow:
    preset: fast            # OpenCV DIS preset (experiment 03)
    warm_k: 288.15          # coldness image: 0 at warm_k, 255 at cold_end_k
    cold_end_k: 193.15
    sigma_km: 33            # Gaussian smoothing of the flow field (experiment 03)
    steps: [2, 4, 6]        # half-hour steps ahead for +1, +2, +3 h

himawari:
  bucket_url: https://noaa-himawari9.s3.amazonaws.com/
  prefix: AHI-L1b-FLDK/{yyyy}/{mm}/{dd}/{HHMM}/
  band: B13
  segments: [5, 6, 7]                     # check coverage on first decode

cmr:
  granules: https://cmr.earthdata.nasa.gov/search/granules.json

nasa:
  parallel: 8

target:
  threshold_mm_h: 0.5
  leads_h: [1, 2, 3]

model:
  imerg_lag_minutes: 360     # issue time minus the START of the newest IMERG slot usable at that time
  issue_every_minutes: 30
  climatology_period: ["2025-01-01", "2025-01-21"]   # training period only; full run: 2016-01-01..2023-12-31
  split:                     # dev sample month; full run is a config change
    train: ["2025-01-01", "2025-01-21"]
    valid: ["2025-01-22", "2025-01-25"]
    test:  ["2025-01-26", "2025-01-31"]
  lgbm:
    n_estimators: 2000
    learning_rate: 0.03
    num_leaves: 15
    min_child_samples: 60
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    random_state: 42
    deterministic: true
    force_row_wise: true
    n_jobs: 4
    verbose: -1
  early_stopping_rounds: 100
  features:
    - cold_pct
    - tb_min
    - tb_mean
    - cold_trend_1h
    - nb_cold_pct
    - adv1_pct
    - adv2_pct
    - adv3_pct
    - adv_max_pct
    - flow_kmh
    - rain_lag
    - wet_lag
    - rainmax_lag
    - rain_sum_3h
    - rain_sum_6h
    - rain_sum_24h
    - nb_rain_lag
    - hour_sin
    - hour_cos
    - doy_sin
    - doy_cos
    - area_km2
    - island
    - clim_wet_pct

# From the repo root, create the instance directory and copy this file into it:
# mkdir -p data/dagster && cp orchestration/dagster.yaml data/dagster/
# DAGSTER_HOME=$PWD/data/dagster uv run dagster dev -w orchestration/workspace.yaml

telemetry:
  enabled: false
retention:
  sensor:
    purge_after_days:
      skipped: 7
      failure: 30
      success: 30
  schedule:
    purge_after_days: 30
concurrency:
  runs:
    tag_concurrency_limits:
      - key: pool
        value: nasa
        limit: 1

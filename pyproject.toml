[project]
name = "nowcast"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "typer==0.29.2",
]

[project.scripts]
nowcast = "nowcast.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

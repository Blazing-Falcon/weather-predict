[project]
name = "nowcast"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==2.0.0",
    "fastapi==0.165.0",
    "geopandas==1.2.0",
    "h5py==3.16.0",
    "httpx==0.28.1",
    "lightgbm==4.7.0",
    "opencv-python-headless==5.1.0.95",
    "pillow==13.0.0",
    "pyarrow==26.0.1",
    "pyproj==3.8.0",
    "python-dotenv==1.2.4",
    "pytz==2026.6",
    "pyyaml==6.0.3",
    "satpy==0.60.0",
    "scipy==1.18.1",
    "shapely==2.2.0",
    "typer==0.29.2",
    "uvicorn==0.54.0",
]

[project.scripts]
nowcast = "nowcast.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "playwright==1.62.0",
    "pytest==9.2.0",
    "ruff==0.17.6",
]

train = [
    "pyspark==4.3.0",
    "matplotlib==3.11.2",
    "scikit-learn==1.9.1",
]

[tool.uv]
default-groups = ["dev", "train"]
